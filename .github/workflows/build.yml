name: AutoGluon Docker

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Stable AutoGluon version; leave blank for the latest stable release"
        required: false
        type: string
  schedule:
    - cron: "23 3 * * *"
  push:
    branches: [main]
    paths:
      - Dockerfile
      - scripts/**
      - .github/workflows/build.yml

permissions:
  contents: read

concurrency:
  group: autogluon-docker
  cancel-in-progress: false

env:
  # OCI image repositories must be lowercase; the GitHub owner is LJAYi.
  IMAGE: ghcr.io/ljayi/autogluon-docker

jobs:
  version:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      images_complete: ${{ steps.images.outputs.complete }}
      missing_matrix: ${{ steps.images.outputs.matrix }}
      release_exists: ${{ steps.release.outputs.exists }}
    steps:
      - uses: actions/checkout@v7
      - name: Resolve stable version
        id: version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ -n "$REQUESTED_VERSION" ]]; then
            [[ "$REQUESTED_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(\.post[0-9]+)?$ ]] || {
              echo "Version must be a stable x.y.z or x.y.z.postN release" >&2
              exit 1
            }
            VERSION="$REQUESTED_VERSION"
          else
            VERSION="$(python scripts/get-latest-version.py)"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "AutoGluon stable: $VERSION"
      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Check required image tags
        id: images
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail

          MATRIX='{"include":[]}'
          COMPLETE=true
          CPU_COMPLETE=true
          for TAG in "${VERSION}-cpu-py312" latest-cpu-py312; do
            if ! docker manifest inspect "$IMAGE:$TAG" >/dev/null 2>&1; then
              CPU_COMPLETE=false
              echo "Missing image tag: $IMAGE:$TAG"
            fi
          done
          if [[ "$CPU_COMPLETE" != true ]]; then
            COMPLETE=false
            MATRIX="$(jq -c '.include += [{"variant":"cpu","suffix":"cpu-py312","latest":"latest-cpu-py312"}]' <<<"$MATRIX")"
          fi

          GPU_COMPLETE=true
          for TAG in "${VERSION}-gpu-cu132-py312" latest-gpu-cu132-py312; do
            if ! docker manifest inspect "$IMAGE:$TAG" >/dev/null 2>&1; then
              GPU_COMPLETE=false
              echo "Missing image tag: $IMAGE:$TAG"
            fi
          done
          if [[ "$GPU_COMPLETE" != true ]]; then
            COMPLETE=false
            MATRIX="$(jq -c '.include += [{"variant":"gpu","suffix":"gpu-cu132-py312","latest":"latest-gpu-cu132-py312"}]' <<<"$MATRIX")"
          fi

          echo "complete=$COMPLETE" >> "$GITHUB_OUTPUT"
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
      - name: Check GitHub Release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if gh release view "autogluon-${VERSION}" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: version
    if: needs.version.outputs.images_complete != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.version.outputs.missing_matrix) }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          target: final
          push: true
          build-args: |
            VARIANT=${{ matrix.variant }}
            AUTOGLUON_VERSION=${{ needs.version.outputs.version }}
          tags: |
            ${{ env.IMAGE }}:${{ needs.version.outputs.version }}-${{ matrix.suffix }}
            ${{ env.IMAGE }}:${{ matrix.latest }}
          provenance: false
          cache-from: type=gha,scope=${{ matrix.variant }}
          cache-to: type=gha,mode=max,scope=${{ matrix.variant }}

  smoke:
    needs: [version, build]
    if: ${{ always() && needs.version.result == 'success' && (needs.build.result == 'success' || needs.build.result == 'skipped') && (needs.version.outputs.images_complete != 'true' || needs.version.outputs.release_exists != 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      packages: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: cpu
            suffix: cpu-py312
            expected_cuda: none
          - variant: gpu
            suffix: gpu-cu132-py312
            expected_cuda: "13.2"
    steps:
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Run import smoke test
        env:
          VERSION: ${{ needs.version.outputs.version }}
          EXPECTED_CUDA: ${{ matrix.expected_cuda }}
        run: |
          set -euo pipefail
          docker run --rm \
            -e EXPECTED_VERSION="$VERSION" \
            -e EXPECTED_CUDA="$EXPECTED_CUDA" \
            "$IMAGE:$VERSION-${{ matrix.suffix }}" \
            python /tests/smoke-test.py

  release:
    needs: [version, build, smoke]
    if: ${{ always() && needs.version.result == 'success' && needs.version.outputs.release_exists != 'true' && needs.smoke.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          TAG="autogluon-${VERSION}"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists; nothing to do."
            exit 0
          fi
          cat > release-notes.md <<EOF
          AutoGluon ${VERSION} CPU/GPU images passed build and smoke tests.

          CPU: ${IMAGE}:${VERSION}-cpu-py312
          GPU: ${IMAGE}:${VERSION}-gpu-cu132-py312
          EOF
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TAG" \
            --notes-file release-notes.md
